{% if rooms %}<div class="room-list">{% for room in rooms %}<div><span>Room {{ room.number }}<small>{{ room.type }} • ₦{{ '{:,.0f}'.format(room.rate) }}</small></span><b class="{{ room.status|lower }}">{{ room.status }}</b>{% if room.guest %}<small>{{ room.guest }}</small>{% endif %}{% if role == 'reception' %}<form class="room-edit" method="post" action="{{ url_for('update_room', room_number=room.number) }}"><input type="hidden" name="reference" value="true"><select name="status" aria-label="Change status for room {{ room.number }}"><option value="">Edit Room / Change Status</option><option value="available">Available</option><option value="booked">Booked</option><option value="occupied">Occupied</option><option value="cleaning">Cleaning</option><option value="unavailable">Unavailable</option></select><button type="submit">Save</button></form>{% endif %}</div>{% endfor %}</div>{% else %}<p class="empty-state">No rooms have been registered yet.</p>{% endif %}

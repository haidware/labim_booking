<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rooms — book available hotel rooms or preview sample house-rental listings.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rooms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rooms</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #fbfcfc;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fbfcfc;
      z-index: 1;
    }

    #app-loading::after {
      content: "";
      width: 42px;
      height: 42px;
      border: 4px solid #dce9eb;
      border-top-color: #17607a;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }

    @keyframes app-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading::after {
        animation-duration: 2s;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Loading Rooms"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
